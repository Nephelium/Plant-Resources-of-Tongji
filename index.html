<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#28724f" />
    <script>
      // Apply the saved or system appearance before the first paint.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("tongjiplants_theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#16181b" : "#fafbf8";
      })();
    </script>
    <meta
      name="description"
      content="素不莳花，同济大学校园植物资源网。沿着植物地图认识校园草木，检索植物、浏览分类、阅读自然手记。"
    />
    <title>素不莳花 · 同济大学植物资源</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
